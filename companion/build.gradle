plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.remote.control.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.remote.control.companion"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
