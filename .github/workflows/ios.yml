name: iOS Build & Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from version.properties
        id: version
        run: |
          MAJOR=$(grep '^major=' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          MINOR=$(grep '^minor=' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          PATCH=$(grep '^patch=' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          VERSION="${MAJOR:-1}.${MINOR:-0}.${PATCH:-0}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building iOS TV Remote v$VERSION"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS Application (.app)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa and .app.zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p build/Payload
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/TV Remote.app"
          
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r "Remote_control-v${VERSION}-iOS.ipa" Payload
            zip -r "TV_Remote-v${VERSION}-iOS.app.zip" "DerivedData/Build/Products/Release-iphoneos/TV Remote.app"
            cd ..
          else
            echo "Error: $APP_PATH not found"
            exit 1
          fi

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Remote_control-v${{ steps.version.outputs.version }}-ios
          path: |
            build/Remote_control-v${{ steps.version.outputs.version }}-iOS.ipa
            build/TV_Remote-v${{ steps.version.outputs.version }}-iOS.app.zip

      - name: Attach iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Release v${{ steps.version.outputs.version }} (Universal Android TV, Samsung & iOS)"
          files: |
            build/Remote_control-v${{ steps.version.outputs.version }}-iOS.ipa
            build/TV_Remote-v${{ steps.version.outputs.version }}-iOS.app.zip
