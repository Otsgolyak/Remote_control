name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Read version from version.properties
      id: version
      run: |
        MAJOR=$(grep '^major=' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
        MINOR=$(grep '^minor=' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
        PATCH=$(grep '^patch=' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
        VERSION="${MAJOR:-1}.${MINOR:-0}.${PATCH:-0}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building Remote_control v$VERSION"

    - name: Build Debug APK
      run: |
        gradle :app:assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Remote_control-v${{ steps.version.outputs.version }}.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Remote_control-v${{ steps.version.outputs.version }}-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/Remote_control-v${{ steps.version.outputs.version }}.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: "Release v${{ steps.version.outputs.version }} (Universal Android TV & Samsung Remote)"
        body: "Нативный пульт для Android TV (Xiaomi TV) + Samsung Tizen TV с Bluetooth HID аэромышью и голосовым вводом. Версия v${{ steps.version.outputs.version }}."
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/Remote_control-v${{ steps.version.outputs.version }}.apk
        make_latest: true
        draft: false
        prerelease: false
