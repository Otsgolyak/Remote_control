name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        gradle :app:assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Remote_control-v1.0.0.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Remote_control-v1.0.0-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/Remote_control-v1.0.0.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Release v1.0.0 (Universal Android TV & Samsung Remote)"
        body: "Нативный пульт для Android TV (Xiaomi TV) + Samsung Tizen TV с Bluetooth HID аэромышью и голосовым вводом."
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/Remote_control-v1.0.0.apk
        draft: false
        prerelease: false
