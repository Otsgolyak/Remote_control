name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew :app:assembleDebug
        else
          gradle :app:assembleDebug
        fi
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Remote_control-v1.0.0.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Remote_control-v1.0.0-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/Remote_control-v1.0.0.apk

    - name: Publish to GitHub Releases
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Release v1.0.0 (Xiaomi TV Remote)"
        body: "Нативный Wi-Fi + Bluetooth пульт для Android TV (Xiaomi TV). Скачайте APK ниже для прямой установки на смартфон."
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/Remote_control-v1.0.0.apk
        draft: false
        prerelease: false
